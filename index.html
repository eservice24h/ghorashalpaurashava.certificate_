<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; border: 4px solid #4CAF50; border-radius: 15px; width: 100%; max-width: 450px; padding: 30px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; position: relative; }
        .logo-container { width: 90px; height: 90px; border: 3px solid #f44336; border-radius: 50%; margin: -60px auto 20px auto; background: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .logo-container img { width: 75px; height: 75px; object-fit: contain; }
        h2.approved-title { color: #4CAF50; font-size: 22px; margin: 10px 0 5px 0; font-weight: bold; }
        h3.municipality-name { color: #0d1b2a; font-size: 20px; margin: 0 0 20px 0; text-transform: uppercase; }
        .divider { color: #8b0000; font-weight: bold; margin: 15px 0; font-size: 14px; letter-spacing: 1px; }
        .details-list { text-align: left; margin: 20px 0; padding: 0 10px; }
        .details-list p { font-size: 16px; margin: 10px 0; color: #333; }
        .details-list span { font-weight: bold; }
        .footer-status { color: #4CAF50; font-size: 16px; font-style: italic; font-weight: bold; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <img src="logo.png" alt="Logo">
        </div>

        <h2 class="approved-title">THIS CERTIFICATE IS APPROVED</h2>
        <h2 class="approved-title" style="margin-top: 0;">BY</h2>
        <h3 class="municipality-name">GHORASHAL MUNICIPALITY</h3>

        <div class="divider">----Certificate Details----</div>

        <div class="details-list">
            <p><span>Name:</span> সাবরিনা আক্তার রিতু</p>
            <p><span>Father/Husband Name:</span> মাহমুদোল নবিন সোহেল</p>
            <p><span>District:</span> Narsingdi</p>
            <p><span>Country:</span> Bangladesh</p>
        </div>

        <div class="footer-status">100% authentic certificate!</div>
    </div>
</body>
</html>
